version: "3.8"

services:
  postgres:
    container_name: postgres
    image: postgres:14.1-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=af1spider
    restart: always
    volumes:
      - af1spider:/var/lib/postgresql/data
volumes:
  af1spider: